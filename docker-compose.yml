services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${TAB10_POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${TAB10_POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${TAB10_POSTGRES_DB:?Copy .env.example to .env}
    volumes:
      - tab10_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tab10_pg:
