services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: tab10_test
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: tab10_test
    ports:
      - "127.0.0.1:33030:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tab10_test -d tab10_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

