services:
  postgres-verify:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      POSTGRES_USER: tab10_test
      POSTGRES_DB: tab10_test
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tab10_test -d tab10_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 10s
