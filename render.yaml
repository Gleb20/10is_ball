# Render Blueprint — Tab-10 API
# https://render.com/docs/blueprint-spec
# После создания: подставьте DATABASE_URL (Neon) и при необходимости WEB_ORIGIN в Dashboard.

services:
  - type: web
    name: 10is_ball
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /ready
    buildCommand: npm install -g pnpm@9.15.0 --prefix "$HOME/.local" && export PATH="$HOME/.local/bin:$PATH" && pnpm install --frozen-lockfile --prod=false --filter "@tab10/api..." && pnpm run build:api
    startCommand: export PATH="$HOME/.local/bin:$PATH" && MIGRATION_DATABASE_URL="${DATABASE_URL/-pooler/}" TAB10_MIGRATION_CONFIRM_SHA="$RENDER_GIT_COMMIT" TAB10_RELEASE_SHA="$RENDER_GIT_COMMIT" GITHUB_SHA="$RENDER_GIT_COMMIT" pnpm run db:migrate -- --mode=apply && pnpm --filter @tab10/api start
    envVars:
      - key: NODE_VERSION
        value: "24.20.0"
      - key: NODE_ENV
        value: production
      - key: TAB10_ENVIRONMENT
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: SEED_ADMIN
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: TAB10_NEON_PROJECT_ID
        sync: false
      - key: TAB10_EXPECTED_NEON_PROJECT_ID
        sync: false
      - key: TAB10_NEON_BRANCH_ID
        sync: false
      - key: TAB10_EXPECTED_NEON_BRANCH_ID
        sync: false
      - key: TAB10_NEON_DATABASE
        sync: false
      - key: TAB10_EXPECTED_NEON_DATABASE
        sync: false
      - key: TAB10_NEON_DIRECT_HOST
        sync: false
      - key: TAB10_NEON_MIGRATION_ROLE
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SAME_SITE
        sync: false
