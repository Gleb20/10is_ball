<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370" role="img" aria-labelledby="title desc">
<title id="title">Предварительный образец статуса до и после</title>
<desc id="desc">Слева статус Ожидание с треугольником раскрытия; справа тот же статус без треугольника. Текст и цвет сохранены, действие карточки остаётся отдельно.</desc>
<rect width="1040" height="370" fill="#ffffff"/>
<text x="38" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#202124">GAP-034 · общий статус</text>
<text x="38" y="70" font-family="Arial, sans-serif" font-size="14" fill="#555">Схема target для согласования, не кадр реализованного продукта</text>
<rect x="38" y="96" width="460" height="186" rx="16" fill="#fff" stroke="#d9d9df"/>
<rect x="542" y="96" width="460" height="186" rx="16" fill="#fff" stroke="#d9d9df"/>
<text x="60" y="127" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202124">До · текущий runtime</text>
<text x="564" y="127" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202124">После · предлагаемый sample</text>
<rect x="62" y="151" width="115" height="28" rx="14" fill="#ebdefc"/>
<path d="M75 160 L85 160 L80 166 Z" fill="#5814ab"/>
<text x="91" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5814ab">Ожидание</text>
<rect x="566" y="151" width="99" height="28" rx="14" fill="#ebdefc"/>
<text x="577" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5814ab">Ожидание</text>
<text x="62" y="211" font-family="Arial, sans-serif" font-size="14" fill="#444">▾ намекает на раскрытие</text>
<text x="62" y="236" font-family="Arial, sans-serif" font-size="14" fill="#444">pointer и hover намекают на нажатие</text>
<text x="566" y="211" font-family="Arial, sans-serif" font-size="14" fill="#444">1 · тот же текст и цвет статуса</text>
<text x="566" y="236" font-family="Arial, sans-serif" font-size="14" fill="#444">2 · без собственного hover и pointer</text>
<path d="M38 302 H1002" stroke="#d9d9df"/>
<text x="38" y="329" font-family="Arial, sans-serif" font-size="15" fill="#202124">3 · Карточка вокруг статуса остаётся ссылкой; её фокус и переход сохраняются.</text>
<text x="38" y="354" font-family="Arial, sans-serif" font-size="13" fill="#666">Сетка, подача, локальные метаданные и иконки исхода этой схемой не изменяются.</text>
</svg>
